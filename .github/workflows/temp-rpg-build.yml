name: Temporary build check
on:
  push:
    branches:
      - refactor/remove-rpg-system
permissions:
  statuses: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and report first error
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          if [ "$code" -ne 0 ]; then
            first_error=$(grep -E 'error TS[0-9]+:|error during build|ERROR|Error:' build.log | head -1 | tr '\n' ' ' | cut -c1-130)
            [ -z "$first_error" ] && first_error="Build failed; inspect GitHub Actions"
            curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "$(jq -n --arg state failure --arg context 'RPG refactor build detail' --arg description "$first_error" '{state:$state,context:$context,description:$description}')"
            exit "$code"
          fi
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "$(jq -n --arg state success --arg context 'RPG refactor build detail' --arg description 'npm run build passed' '{state:$state,context:$context,description:$description}')"
