      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        display: flex;
        align-items: center;
        justify-content: center;
        width: 5rem;
        height: 5rem;
        overflow: hidden;
        border-radius: 1rem;
        border: 1px solid rgb(42 42 42);
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.26),
          rgba(167, 139, 250, 0.1),
          rgba(255, 255, 255, 0.06)
        );
        box-shadow: 0 18px 40px rgba(139, 92, 246, 0.16);
      }

      #boot-splash .boot-logo svg {
        width: 62%;
        height: 62%;
        color: #ffffff;
      }

      #boot-splash .boot-title {
        margin-top: 1.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      #boot-splash .boot-status {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: rgba(148, 163, 184, 0.8);
      }

      #root:empty {
        min-height: 100vh;
        background: #0a0a0a;
      }
